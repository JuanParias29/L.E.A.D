version: '3.8'

services:
	lead-app:
		build:
			context: ..
			dockerfile: docker/Dockerfile
		container_name: lead-forecasting-app
		ports:
			- "8501:8501"
		volumes:
			- ../data:/app/data
			- ../models:/app/models
			- ..:/app:cached
		environment:
			- PYTHONUNBUFFERED=1
		restart: unless-stopped
